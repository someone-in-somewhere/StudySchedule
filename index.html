<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Học</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px 10px 0 0;
            background: rgba(255,255,255,0.3);
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.5); }
        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }
        header h1 { color: #333; font-size: 1.8em; margin-bottom: 10px; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 140px;
        }
        .stat-box h3 { font-size: 0.9em; opacity: 0.9; }
        .stat-box p { font-size: 1.8em; font-weight: bold; }
        .progress-bar-container {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .search-box input:focus { outline: none; border-color: #667eea; }
        .filter-box select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }
        .status-filter { display: flex; gap: 10px; }
        .status-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .status-btn:hover, .status-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .reset-btn {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .reset-btn:hover { background: #c82333; }

        .chapter {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .chapter-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chapter-header h2 { font-size: 1.2em; }
        .chapter-progress {
            background: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        .chapter-content { padding: 0; display: none; }
        .chapter-content.open { display: block; }

        .lesson {
            border-bottom: 1px solid #eee;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }
        .lesson:hover { background: #f8f9ff; }
        .lesson:last-child { border-bottom: none; }
        .lesson-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }
        .lesson-number {
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
            flex-shrink: 0;
        }
        .lesson-info { flex: 1; }
        .lesson-title { font-weight: 600; color: #333; margin-bottom: 5px; }
        .lesson-meta { font-size: 0.85em; color: #666; }
        .lesson-meta span { margin-right: 15px; }
        .lesson-note {
            background: #fff3cd;
            color: #856404;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            display: inline-block;
            margin-top: 5px;
        }
        .lesson-note.important { background: #f8d7da; color: #721c24; }
        .lesson-note.new { background: #d4edda; color: #155724; }
        .view-detail {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .view-detail:hover { background: #5a6fd6; }
        .completed .lesson-number { background: #28a745; }
        .completed .lesson-title { text-decoration: line-through; opacity: 0.7; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal.show {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            margin: 40px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlide 0.3s ease;
        }
        @keyframes modalSlide {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .modal-header h2 { font-size: 1.3em; margin-bottom: 10px; }
        .modal-header .lesson-id { opacity: 0.8; font-size: 0.9em; }
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
        }
        .close-btn:hover { background: rgba(255,255,255,0.3); }
        .modal-body { padding: 25px; }
        .detail-section { margin-bottom: 20px; }
        .detail-section h3 { color: #667eea; margin-bottom: 10px; font-size: 1.1em; }
        .detail-content {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-line;
            line-height: 1.6;
            font-size: 0.95em;
        }
        .detail-meta { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .meta-item { background: #e8ebff; padding: 10px 15px; border-radius: 8px; }
        .meta-item label { color: #666; font-size: 0.8em; display: block; }
        .meta-item p { font-weight: 600; color: #333; font-size: 0.95em; }

        @media (max-width: 768px) {
            .stats { flex-direction: column; }
            .stat-box { width: 100%; }
            .controls { flex-direction: column; }
            .search-box, .filter-box select { width: 100%; }
            .lesson { flex-wrap: wrap; }
            .view-detail { width: 100%; margin-top: 10px; }
            .tab-btn { padding: 10px 15px; font-size: 0.9em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('android')">Android & Testing</button>
            <button class="tab-btn" onclick="switchTab('algorithm')">Thuật toán</button>
        </div>

        <header>
            <h1 id="course-title">Android Development & Testing</h1>
            <p style="color: #666; margin-top: 5px;">Theo dõi tiến độ học tập của bạn</p>
            <div class="stats">
                <div class="stat-box">
                    <h3>Tổng số bài</h3>
                    <p id="total-lessons">0</p>
                </div>
                <div class="stat-box">
                    <h3>Đã hoàn thành</h3>
                    <p id="completed-lessons">0</p>
                </div>
                <div class="stat-box">
                    <h3 id="stat-label">Tổng số tiết</h3>
                    <p id="total-periods">0</p>
                </div>
                <div class="stat-box">
                    <h3>Tiến độ</h3>
                    <p id="progress-percent">0%</p>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="main-progress" style="width: 0%"></div>
            </div>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Tìm kiếm bài học...">
            </div>
            <div class="filter-box">
                <select id="chapter-filter"></select>
            </div>
            <div class="status-filter">
                <button class="status-btn active" data-status="all">Tất cả</button>
                <button class="status-btn" data-status="completed">Đã học</button>
                <button class="status-btn" data-status="incomplete">Chưa học</button>
            </div>
            <button class="reset-btn" onclick="resetProgress()">Reset</button>
        </div>

        <div id="chapters-container"></div>
    </div>

    <!-- Modal -->
    <div class="modal" id="lesson-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-title"></h2>
                    <div class="lesson-id" id="modal-lesson-id"></div>
                </div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="detail-meta" id="modal-meta"></div>
                <div class="detail-section">
                    <h3>Chi tiết nội dung học</h3>
                    <div class="detail-content" id="modal-detail"></div>
                </div>
                <div class="detail-section" id="prerequisite-section">
                    <h3>Nội dung tiên quyết</h3>
                    <div class="detail-content" id="modal-prerequisite"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="algorithm-data.js"></script>
    <script src="android-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
