    <title>Quản Lý Lịch Học - Android & Testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }

        header h1 {
            color: #333;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 150px;
        }

        .stat-box h3 {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stat-box p {
            font-size: 1.8em;
            font-weight: bold;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-box select {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            background: white;
            cursor: pointer;
            min-width: 200px;
        }

        .filter-box select:focus {
            outline: none;
            border-color: #667eea;
        }

        .status-filter {
            display: flex;
            gap: 10px;
        }

        .status-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .status-btn:hover, .status-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .chapter {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .chapter-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chapter-header:hover {
            opacity: 0.95;
        }

        .chapter-header h2 {
            font-size: 1.2em;
        }

        .chapter-progress {
            background: rgba(255,255,255,0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }

        .chapter-content {
            padding: 0;
            display: none;
        }

        .chapter-content.open {
            display: block;
        }

        .lesson {
            border-bottom: 1px solid #eee;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }

        .lesson:hover {
            background: #f8f9ff;
        }

        .lesson:last-child {
            border-bottom: none;
        }

        .lesson-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .lesson-number {
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9em;
            flex-shrink: 0;
        }

        .lesson-info {
            flex: 1;
        }

        .lesson-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .lesson-meta {
            font-size: 0.85em;
            color: #666;
        }

        .lesson-meta span {
            margin-right: 15px;
        }

        .lesson-note {
            background: #fff3cd;
            color: #856404;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.8em;
        }

        .lesson-note.important {
            background: #f8d7da;
            color: #721c24;
        }

        .lesson-note.new {
            background: #d4edda;
            color: #155724;
        }

        .view-detail {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .view-detail:hover {
            background: #5a6fd6;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.show {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            margin: 40px 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-header h2 {
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        .modal-header .lesson-id {
            opacity: 0.8;
            font-size: 0.9em;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .modal-body {
            padding: 25px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .detail-content {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-line;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .meta-item {
            background: #e8ebff;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .meta-item label {
            color: #666;
            font-size: 0.85em;
        }

        .meta-item p {
            font-weight: 600;
            color: #333;
        }

        .progress-bar-container {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 5px;
            transition: width 0.5s ease;
        }

        .completed .lesson-number {
            background: #28a745;
        }

        .completed .lesson-title {
            text-decoration: line-through;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats {
                flex-direction: column;
            }

            .stat-box {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }

            .search-box, .filter-box select {
                width: 100%;
            }

            .lesson {
                flex-wrap: wrap;
            }

            .view-detail {
                width: 100%;
                margin-top: 10px;
            }
        }

        /* Reset Progress Button */
        .reset-btn {
            padding: 10px 20px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .reset-btn:hover {
            background: #c82333;
        }
    </style>
</head>

                </div>
            </div>
        </div>
    </div>

        const chapters = [
            { id: 1, name: "CHƯƠNG 1: ABSOLUTE BEGINNER - Kiến thức nền tảng", totalPeriods: 25 },
            { id: 2, name: "CHƯƠNG 2: JAVA FUNDAMENTALS & OOP", totalPeriods: 30 },
            { id: 3, name: "CHƯƠNG 3: KOTLIN FUNDAMENTALS", totalPeriods: 26 },
            { id: 4, name: "CHƯƠNG 4: ANDROID BASICS - Hiểu Android Development", totalPeriods: 29 },
            { id: 5, name: "CHƯƠNG 5: TESTING FUNDAMENTALS", totalPeriods: 35 },
            { id: 6, name: "CHƯƠNG 6: ANDROID PROFILING & PERFORMANCE ANALYSIS", totalPeriods: 50 },
            { id: 7, name: "CHƯƠNG 7: ADVANCED TESTING & ANALYSIS", totalPeriods: 37 }
        ];

        // State
        let completedLessons = JSON.parse(localStorage.getItem('completedLessons') || '[]');
        let currentFilter = 'all';
        let currentChapter = 'all';
        let searchQuery = '';

        // Functions
        function saveProgress() {
            localStorage.setItem('completedLessons', JSON.stringify(completedLessons));
            updateStats();
        }

        function toggleLesson(lessonId) {
            const index = completedLessons.indexOf(lessonId);
            if (index === -1) {
                completedLessons.push(lessonId);
            } else {
                completedLessons.splice(index, 1);
            }
            saveProgress();
            renderChapters();
        }

        function updateStats() {
            const totalLessons = courseData.length;
            const completed = completedLessons.length;
            const totalPeriods = courseData.reduce((sum, lesson) => sum + lesson.numPeriods, 0);
            const completedPeriods = courseData
                .filter(lesson => completedLessons.includes(lesson.id))
                .reduce((sum, lesson) => sum + lesson.numPeriods, 0);
            const percent = totalLessons > 0 ? Math.round((completed / totalLessons) * 100) : 0;

            document.getElementById('total-lessons').textContent = totalLessons;
            document.getElementById('completed-lessons').textContent = completed;
            document.getElementById('total-periods').textContent = totalPeriods;
            document.getElementById('progress-percent').textContent = percent + '%';
            document.getElementById('main-progress').style.width = percent + '%';
        }

        function getFilteredLessons() {
            return courseData.filter(lesson => {
                const matchesChapter = currentChapter === 'all' || lesson.chapter === parseInt(currentChapter);
                const matchesStatus = currentFilter === 'all' ||
                    (currentFilter === 'completed' && completedLessons.includes(lesson.id)) ||
                    (currentFilter === 'incomplete' && !completedLessons.includes(lesson.id));
                const matchesSearch = searchQuery === '' ||
                    lesson.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    lesson.detail.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesChapter && matchesStatus && matchesSearch;
            });
        }

        function renderChapters() {
            const container = document.getElementById('chapters-container');
            const filteredLessons = getFilteredLessons();

            // Group by chapter
            const groupedByChapter = {};
            filteredLessons.forEach(lesson => {
                if (!groupedByChapter[lesson.chapter]) {
                    groupedByChapter[lesson.chapter] = [];
                }
                groupedByChapter[lesson.chapter].push(lesson);
            });

            container.innerHTML = '';

            chapters.forEach(chapter => {
                if (!groupedByChapter[chapter.id] || groupedByChapter[chapter.id].length === 0) return;

                const chapterLessons = groupedByChapter[chapter.id];
                const completedInChapter = chapterLessons.filter(l => completedLessons.includes(l.id)).length;
                const totalInChapter = courseData.filter(l => l.chapter === chapter.id).length;

                const chapterEl = document.createElement('div');
                chapterEl.className = 'chapter';
                chapterEl.innerHTML = `
                    <div class="chapter-header" onclick="toggleChapter(${chapter.id})">
                        <h2>${chapter.name}</h2>
                        <span class="chapter-progress">${completedInChapter}/${totalInChapter} bài</span>
                    </div>
                    <div class="chapter-content open" id="chapter-${chapter.id}">
                        ${chapterLessons.map(lesson => renderLesson(lesson)).join('')}
                    </div>
                `;
                container.appendChild(chapterEl);
            });
        }

        function renderLesson(lesson) {
            const isCompleted = completedLessons.includes(lesson.id);
            let noteClass = '';
            if (lesson.note.includes('quan trọng') || lesson.note.includes('CRITICAL') || lesson.note.includes('Important')) {
                noteClass = 'important';
            } else if (lesson.note.includes('NEW') || lesson.note.includes('Enhanced')) {
                noteClass = 'new';
            }

            return `
                <div class="lesson ${isCompleted ? 'completed' : ''}">
                    <input type="checkbox" class="lesson-checkbox"
                        ${isCompleted ? 'checked' : ''}
                        onchange="toggleLesson(${lesson.id})">
                    <div class="lesson-number">${lesson.id}</div>
                    <div class="lesson-info">
                        <div class="lesson-title">${lesson.title}</div>
                        <div class="lesson-meta">
                            <span>📚 Tiết: ${lesson.periods}</span>
                            <span>⏱️ ${lesson.numPeriods} tiết</span>
                            ${lesson.prerequisite ? `<span>📋 Tiên quyết: ${lesson.prerequisite}</span>` : ''}
                        </div>
                        ${lesson.note ? `<span class="lesson-note ${noteClass}">${lesson.note}</span>` : ''}
                    </div>
                    <button class="view-detail" onclick="showDetail(${lesson.id})">Chi tiết</button>
                </div>
            `;
        }

        function toggleChapter(chapterId) {
            const content = document.getElementById(`chapter-${chapterId}`);
            content.classList.toggle('open');
        }

        function showDetail(lessonId) {
            const lesson = courseData.find(l => l.id === lessonId);
            if (!lesson) return;

            document.getElementById('modal-title').textContent = lesson.title;
            document.getElementById('modal-lesson-id').textContent = `Bài ${lesson.id} | Tiết ${lesson.periods}`;
            document.getElementById('modal-detail').textContent = lesson.detail;

            document.getElementById('modal-meta').innerHTML = `
                <div class="meta-item">
                    <label>Số tiết</label>
                    <p>${lesson.numPeriods} tiết</p>
                </div>
                <div class="meta-item">
                    <label>Chương</label>
                    <p>${chapters.find(c => c.id === lesson.chapter).name.split(':')[0]}</p>
                </div>
                ${lesson.note ? `
                <div class="meta-item">
                    <label>Ghi chú</label>
                    <p>${lesson.note}</p>
                </div>
                ` : ''}
            `;

            if (lesson.prerequisite) {
                document.getElementById('prerequisite-section').style.display = 'block';
                document.getElementById('modal-prerequisite').textContent = lesson.prerequisite;
            } else {
                document.getElementById('prerequisite-section').style.display = 'none';
            }

            document.getElementById('lesson-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('lesson-modal').classList.remove('show');
        }

        function resetProgress() {
            if (confirm('Bạn có chắc muốn xóa tất cả tiến độ học tập?')) {
                completedLessons = [];
                saveProgress();
                renderChapters();
            }
        }

        // Event listeners
        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderChapters();
        });

        document.getElementById('chapter-filter').addEventListener('change', (e) => {
            currentChapter = e.target.value;
            renderChapters();
        });

        document.querySelectorAll('.status-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.status;
                renderChapters();
            });
        });

        // Close modal when clicking outside
        document.getElementById('lesson-modal').addEventListener('click', (e) => {
            if (e.target.id === 'lesson-modal') {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Initialize
        updateStats();
        renderChapters();
    </script>
</body>
</html>
